<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Đăng nhập để dịch tiếng Việt và tiếng Trung.">
  <title>Đăng nhập | Dịch Việt · Trung</title>
  <script>
    // Reuse the translator's theme preference before the first paint.
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem('translatorTheme') === 'dark' ? 'dark' : 'light';
    } catch (_) {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
  <style>
    :root{
      color-scheme:light;
      --bg:#fff;--surface:#fff;--text:#202124;--muted:#5f6368;
      --border:#dadce0;--hover:#f8fafd;--blue:#1a73e8;
    }
    :root[data-theme="dark"]{
      color-scheme:dark;
      --bg:#17191d;--surface:#24272e;--text:#edf0f5;
      --muted:#b3bac5;--border:#3d424a;--hover:#343f53;--blue:#9cc1ff;
    }
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--bg)}
    body{
      min-height:100vh;min-height:100svh;margin:0;padding:24px;
      display:grid;place-items:center;
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--bg);color:var(--text);
    }
    .card{
      width:min(100%,410px);padding:40px 36px 34px;
      background:var(--surface);border:1px solid var(--border);
      border-radius:22px;text-align:center;
      box-shadow:0 12px 38px rgba(32,33,36,.045);
    }
    .mark{
      width:56px;height:56px;margin:0 auto 22px;
      display:grid;place-items:center;border-radius:16px;
      color:#1967d2;background:#e8f0fe;font-size:30px;font-weight:650;
    }
    h1{font-size:25px;letter-spacing:-.7px;line-height:1.3;margin:0 0 8px;font-weight:700}
    .subtitle{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 29px}
    .google{
      display:flex;align-items:center;justify-content:center;gap:12px;
      min-height:52px;width:100%;padding:12px 18px;
      background:var(--bg);color:var(--text);border:1px solid var(--border);
      border-radius:12px;text-decoration:none;font-size:15px;font-weight:600;
      transition:background .15s,border-color .15s;
    }
    .google:hover{background:var(--hover);border-color:var(--blue)}
    .google:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
    .google svg{width:22px;height:22px;flex-shrink:0}
    .note{margin:22px 0 0;color:var(--muted);font-size:12px;line-height:1.5}
    .error{
      display:none;margin:0 0 18px;padding:11px 12px;border-radius:10px;
      border:1px solid #f5b8b8;background:#fff3f3;color:#a12424;
      font-size:13px;line-height:1.5;text-align:left;
    }
    .error.show{display:block}
    :root[data-theme="dark"] .error{background:#3d2227;color:#ffb8b8;border-color:#844049}
    @media(max-width:480px){
      body{padding:18px}
      .card{padding:34px 22px 28px;border-radius:18px}
      h1{font-size:23px}
    }
    @media(prefers-reduced-motion:reduce){.google{transition:none}}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">文</div>
    <h1>Đăng nhập</h1>
    <p class="subtitle">Dịch tiếng Việt và tiếng Trung dễ dàng.</p>
    <div id="loginError" class="error" role="alert"></div>
    <a class="google" href="/auth/google">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.25 5.48-4.76 7.18l7.73 6C44.42 38.03 46.98 31.88 46.98 24.55z"/><path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.2A23.9 23.9 0 0 0 0 24c0 3.87.93 7.52 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6c-2.15 1.45-4.92 2.3-8.18 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      <span>Tiếp tục với Google</span>
    </a>
    <p class="note">Đăng nhập an toàn · Tự động tạo tài khoản FREE</p>
  </main>
  <script>
    const error = new URLSearchParams(window.location.search).get('error');
    if (error) {
      const messages = {
        access_denied: 'Bạn đã hủy đăng nhập Google.',
        oauth_failed: 'Không thể đăng nhập bằng Google. Vui lòng thử lại.',
        account_disabled: 'Tài khoản của bạn đã bị khóa.',
        maintenance: 'Website đang bảo trì, quay lại sau'
      };
      const box = document.getElementById('loginError');
      box.textContent = messages[error] || 'Đăng nhập chưa thành công. Vui lòng thử lại.';
      box.classList.add('show');
    }
  </script>
</body>
</html>
